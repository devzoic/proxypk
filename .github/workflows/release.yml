name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: 'ProxyPK Desktop Agent ${{ github.ref_type == "tag" && github.ref_name || inputs.tag }}'
          releaseBody: |
            ### ProxyPK Desktop Node Agent Release

            #### What's New:
            - Automated OTA background updates
            - Intelligent residential proxy routing
            - Multi-interface hardware binding (Wingle LTE / Wi-Fi / Ethernet)
            - Live activity streaming & low-latency control plane synchronization
            - High-performance SOCKS5 and HTTP/HTTPS dual proxy engine

            #### Assets Included:
            - **macOS**: `.dmg` and `.app` (Apple Silicon & Intel)
            - **Linux**: `.AppImage` and `.deb` (Ubuntu, Debian, Lubuntu)
            - **Windows**: `.msi` and `.exe` installer
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
